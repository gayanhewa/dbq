[build-system]
requires = ["flit_core>=3.9"]
build-backend = "flit_core.buildapi"

[project]
name = "dbq"
version = "0.1.0"
description = "Read-only SQL against Oracle, MySQL, Postgres, SQL Server, SQLite or libsql, with agent-friendly output"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "oracledb>=2",
  "pymysql>=1.1",
  "pg8000>=1.31",
  "python-tds>=1.16",
  "libsql-client>=0.3",
  "python-dotenv>=1",
]

[project.urls]
Repository = "https://github.com/gayanhewa/dbq"

[project.scripts]
dbq = "dbq:main"
