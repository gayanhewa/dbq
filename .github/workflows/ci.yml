name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[libsql]' pytest
      - run: pytest tests/test_unit.py

  integration:
    runs-on: ubuntu-latest
    # Passwords below are throwaway values for containers that live for one job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dbqtest
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: dbqtest
          MYSQL_DATABASE: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pdbqtest --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      sqlserver:
        # No reliable health command in this image; the test fixture retries the login.
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: DbqTest!Passw0rd
        ports:
          - 1433:1433
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: dbqtest
          APP_USER: app
          APP_USER_PASSWORD: dbqtest
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      DBQ_TEST_POSTGRES: postgres://postgres:dbqtest@127.0.0.1:5432/app
      DBQ_TEST_MYSQL: mysql://root:dbqtest@127.0.0.1:3306/app
      DBQ_TEST_SQLSERVER: "Server=127.0.0.1,1433;Database=master;User Id=sa;Password=DbqTest!Passw0rd"
      DBQ_TEST_ORACLE: app/dbqtest@127.0.0.1:1521/FREEPDB1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[libsql]' pytest pg8000 python-tds

      - name: Start SSH bastion
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dbq-ssh/context"
          ssh-keygen -t ed25519 -N '' -f "$RUNNER_TEMP/dbq-ssh/id_ed25519" -C dbq-test
          cp tests/ssh/Dockerfile tests/ssh/sshd_config "$RUNNER_TEMP/dbq-ssh/context/"
          cp "$RUNNER_TEMP/dbq-ssh/id_ed25519.pub" "$RUNNER_TEMP/dbq-ssh/context/authorized_keys"
          docker build -t dbq-ssh "$RUNNER_TEMP/dbq-ssh/context"
          docker run -d --name dbq-ssh \
            -p 127.0.0.1:2222:2222 \
            --add-host=host.docker.internal:host-gateway \
            dbq-ssh

          ready=0
          for _ in $(seq 1 30); do
            ssh-keyscan -p 2222 127.0.0.1 > "$RUNNER_TEMP/dbq-ssh/known_hosts" 2>/dev/null || true
            if ssh -i "$RUNNER_TEMP/dbq-ssh/id_ed25519" -p 2222 \
                 -o BatchMode=yes -o StrictHostKeyChecking=yes \
                 -o UserKnownHostsFile="$RUNNER_TEMP/dbq-ssh/known_hosts" \
                 dbq@127.0.0.1 true; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs dbq-ssh
            exit 1
          fi

          mkdir -p ~/.ssh
          cat "$RUNNER_TEMP/dbq-ssh/known_hosts" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          {
            echo "DBQ_TEST_SSH_TUNNEL=dbq@127.0.0.1:2222"
            echo "DBQ_TEST_SSH_KEY=$RUNNER_TEMP/dbq-ssh/id_ed25519"
            echo "DBQ_TEST_POSTGRES_TUNNEL=postgres://postgres:dbqtest@host.docker.internal:5432/app"
          } >> "$GITHUB_ENV"

      - run: pytest tests/test_integration.py -v

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - run: nix build .#dbq
      - run: ./result/bin/dbq --help
